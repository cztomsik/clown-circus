<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clown-Circus</title>
<script type="importmap">
{
  "imports": {
    "preact": "https://esm.sh/preact@10.29.8",
    "preact/": "https://esm.sh/preact@10.29.8/",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
/* Default (dark) palette. Every utility references var(--color-*), so the
   light block below recolours the whole UI by overriding the same tokens. */
@theme {
  --color-bg: #111318;
  --color-panel: #191c23;
  --color-line: #2a2e39;
  --color-ink: #d7dae0;
  --color-dim: #8b90a0;
  --color-accent: #e8b44f;
  --color-err: #e86a5f;
  --color-ok: #6ac08a;
}
</style>
<style>
/* Light palette: same --color-* tokens, applied when <html data-theme="light">. */
:root[data-theme="light"] {
  --color-bg: #ecebe6;
  --color-panel: #f6f6f2;
  --color-line: #d6d4cc;
  --color-ink: #21242b;
  --color-dim: #6e737b;
  --color-accent: #a56f12;
  --color-err: #c0392b;
  --color-ok: #2f8f5b;
}

/* Working-indicator dots (Message.js): a gentle, staggered bounce that reads
   as "in progress" without shouting. */
@keyframes dot-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-3px); opacity: 1; }
}
.working-dot {
  animation: dot-bounce 1.1s ease-in-out infinite;
}
.working-dot:nth-child(2) { animation-delay: .15s; }
.working-dot:nth-child(3) { animation-delay: .3s; }
</style>
<script>
  // Apply the saved theme before first paint (app.js re-applies on mount).
  try {
    const t = localStorage.getItem('clown-circus-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body class="bg-bg text-ink font-sans text-sm leading-[1.45]">
  <div id="root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
