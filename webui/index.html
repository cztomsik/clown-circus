<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clown-Circus</title>
<style type="text/tailwindcss">
/* Default (dark) palette. Every utility references var(--color-*), so the
   light block below recolours the whole UI by overriding the same tokens. */
@theme {
  --color-bg: #111318;
  --color-panel: #191c23;
  --color-line: #2a2e39;
  --color-ink: #d7dae0;
  --color-dim: #8b90a0;
  --color-accent: #e8b44f;
  --color-err: #e86a5f;
  --color-ok: #6ac08a;
}
</style>
<style>
/* --color-code is used only from the plain CSS injected by Markdown.tsx, so
   it can't live in @theme (the in-browser Tailwind JIT tree-shakes @theme
   vars no utility references). */
:root { --color-code: #6f95a8; }
/* Light palette: same --color-* tokens, applied when <html data-theme="light">. */
:root[data-theme="light"] {
  --color-bg: #ecebe6;
  --color-panel: #f6f6f2;
  --color-line: #d6d4cc;
  --color-ink: #21242b;
  --color-dim: #6e737b;
  --color-accent: #a56f12;
  --color-code: #33667f;
  --color-err: #c0392b;
  --color-ok: #2f8f5b;
}

/* Working-indicator dots (Message.js): a gentle, staggered bounce that reads
   as "in progress" without shouting. */
@keyframes dot-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-3px); opacity: 1; }
}
.working-dot {
  animation: dot-bounce 1.1s ease-in-out infinite;
}
.working-dot:nth-child(2) { animation-delay: .15s; }
.working-dot:nth-child(3) { animation-delay: .3s; }

/* iOS Safari auto-zooms (and sometimes fails to zoom back) when a focused
   input/textarea has a computed font-size under 16px. The body is 14px
   (text-sm), so bump inputs up on small screens. */
@media (max-width: 767px) {
  input, textarea { font-size: 16px; }
}
</style>
</head>
<body class="bg-bg text-ink font-sans text-sm leading-[1.45]">
  <div id="root"></div>
  <script type="module" src="/vendor/bundle.js"></script>
</body>
</html>
