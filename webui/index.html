<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clown-Circus</title>
<style type="text/tailwindcss">
/* Default (dark) palette. Every utility references var(--color-*), so the
   light block below recolours the whole UI by overriding the same tokens. */
@theme {
  --color-bg: #1c1c1e;
  --color-panel: #28282a;
  --color-content: #1c1c1e;
  --color-field: rgba(120,120,128,.18);
  --color-line: #38383a;
  --color-hairline: rgba(255,255,255,.08);
  --color-ink: #f5f5f7;
  --color-dim: #a1a1a6;
  --color-text3: #6e6e73;
  --color-accent: #0a84ff;
  --color-card: rgba(40,40,42,.92);
  --color-material2: rgba(44,44,46,.45);
  --color-sel: rgba(10,132,255,.28);
  --color-err: #ff453a;
  --color-ok: #30d158;
}
</style>
<style>
/* --color-code / --color-material / --color-accent2 are used only from plain
   CSS (Markdown.tsx prose, the .material class, the .grad-accent gradient),
   so they can't live in @theme: the in-browser Tailwind JIT tree-shakes
   @theme vars no utility references, and these have none. */
:root {
  --color-code: #6f95a8;
  --color-material: rgba(44,44,46,.7);
  --color-accent2: #2f9bff;
}
/* Light palette: same --color-* tokens, applied when <html data-theme="light">. */
:root[data-theme="light"] {
  --color-bg: #f4f4f6;
  --color-panel: #ffffff;
  --color-content: #ffffff;
  --color-field: rgba(120,120,128,.1);
  --color-line: #d9d9de;
  --color-hairline: rgba(0,0,0,.07);
  --color-ink: #1d1d1f;
  --color-dim: #6e6e73;
  --color-text3: #a1a1a6;
  --color-accent: #0066d6;
  --color-card: rgba(255,255,255,.9);
  --color-material2: rgba(255,255,255,.4);
  --color-code: #33667f;
  --color-material: rgba(255,255,255,.6);
  --color-sel: rgba(10,132,255,.15);
  --color-accent2: #0a84ff;
  --color-err: #ff3b30;
  --color-ok: #34c759;
}

/* Layered surfaces: the top bar + sidebar are a translucent "material" over
   the window (--color-bg); the main pane is the opaque --color-content.
   Nothing scrolls under the header/sidebar today, so the blur is mostly the
   translucent tint — kept for the frosted-glass look + the mobile drawer,
   where content *does* show through. */
.material {
  background: var(--color-material);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
}

/* Text selection uses the blue --color-sel tint instead of the browser default. */
::selection { background: var(--color-sel); }

/* Thin rounded scrollbars (transcript, sidebar, tool detail, …). */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb {
  background: rgba(128,128,138,.35);
  border-radius: 8px;
  border: 2.5px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(128,128,138,.6);
  background-clip: content-box;
}

/* Working-indicator spinner (Message.tsx): a rotating border-top that reads
   as "in progress" without shouting. */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid var(--color-line);
  border-top-color: var(--color-accent);
  animation: spin .8s linear infinite;
  flex-shrink: 0;
}

/* Quiet activity lines (Message.tsx): the bullet dot is the marker, so hide
   the native <details> disclosure triangle. */
details.q-activity > summary::-webkit-details-marker { display: none; }

/* System-prompt disclosure disc: a small circular chevron that rotates 90°
   when the <details> is open. */
details.q-activity.disc > summary .disc-chevron { transition: transform .15s; }
details.q-activity.disc[open] > summary .disc-chevron { transform: rotate(90deg); }

/* User bubble (Message.tsx): entrance pop + subtle blue shadow. */
@keyframes pop { from { opacity: 0; transform: translateY(5px) scale(.98); } to { opacity: 1; transform: none; } }
.user-bubble {
  animation: pop .18s ease;
  box-shadow: 0 1px 2px rgba(10,132,255,.25);
}
.user-bubble .md a, .user-bubble .md code { color: #fff; }
.user-bubble .md blockquote { color: rgba(255,255,255,.9); border-color: rgba(255,255,255,.35); }
.user-bubble .md pre { background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.3); }

/* iOS Safari auto-zooms (and sometimes fails to zoom back) when a focused
   input/textarea has a computed font-size under 16px. The body is 14px
   (text-sm), so bump inputs up on small screens. */
@media (max-width: 767px) {
  input, textarea { font-size: 16px; }
}

/* Gradient accent fill (primary button, send button). */
.grad-accent {
  background: linear-gradient(var(--color-accent), var(--color-accent2));
}

/* Opaque card for the ⋮ menu (fully solid, so nothing behind shows through). */
.menu-card {
  background: var(--color-panel);
}

/* iOS-style toggle switch. */
.sw {
  position: relative;
  width: 40px; height: 24px; border-radius: 12px;
  background: rgba(120,120,128,.32); flex-shrink: 0;
  transition: background .2s; cursor: pointer;
  border: none; padding: 0; display: inline-block;
}
.sw::after {
  content: "";
  position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.08);
  transition: transform .2s;
}
.sw.on { background: var(--color-ok); }
.sw.on::after { transform: translateX(16px); }
</style>
</head>
<body class="bg-bg text-ink font-sans text-sm leading-[1.45]">
  <div id="root"></div>
  <script type="module" src="/vendor/bundle.js"></script>
</body>
</html>
