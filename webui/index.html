<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clown-Circus</title>
<style type="text/tailwindcss">
/* Default (dark) palette. Every utility references var(--color-*), so the
   light block below recolours the whole UI by overriding the same tokens. */
@theme {
  --color-bg: #111318;
  --color-panel: #191c23;
  --color-line: #2a2e39;
  --color-ink: #d7dae0;
  --color-dim: #8b90a0;
  --color-accent: #e8b44f;
  --color-err: #e86a5f;
  --color-ok: #6ac08a;
}
</style>
<style>
/* --color-code is used only from plain CSS below, so it can't live in
   @theme (the in-browser Tailwind JIT tree-shakes @theme vars no utility references). */
:root { --color-code: #6f95a8; }
/* Light palette: same --color-* tokens, applied when <html data-theme="light">. */
:root[data-theme="light"] {
  --color-bg: #ecebe6;
  --color-panel: #f6f6f2;
  --color-line: #d6d4cc;
  --color-ink: #21242b;
  --color-dim: #6e737b;
  --color-accent: #a56f12;
  --color-code: #33667f;
  --color-err: #c0392b;
  --color-ok: #2f8f5b;
}

/* Working-indicator dots (Message.js): a gentle, staggered bounce that reads
   as "in progress" without shouting. */
@keyframes dot-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-3px); opacity: 1; }
}
.working-dot {
  animation: dot-bounce 1.1s ease-in-out infinite;
}
.working-dot:nth-child(2) { animation-delay: .15s; }
.working-dot:nth-child(3) { animation-delay: .3s; }

/* iOS Safari auto-zooms (and sometimes fails to zoom back) when a focused
   input/textarea has a computed font-size under 16px. The body is 14px
   (text-sm), so bump inputs up on small screens. */
@media (max-width: 767px) {
  input, textarea { font-size: 16px; }
}

/* Markdown rendering (webui/md.js → .md): prose typography for assistant /
   user text, referencing the same --color-* tokens so dark/light theming is
   free. The body font stays sans (only code is mono). */
.md { line-height: 1.55; word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .5em; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 600; margin: .9em 0 .35em; line-height: 1.3; }
.md h1 { font-size: 1.25em; } .md h2 { font-size: 1.15em; } .md h3 { font-size: 1.05em; }
.md h4, .md h5, .md h6 { font-size: 1em; }
/* Tailwind preflight zeroes list-style/padding, so restore markers here. */
.md ul { margin: 0 0 .5em; padding-left: 1.4em; list-style: disc; }
.md ol { margin: 0 0 .5em; padding-left: 1.4em; list-style: decimal; }
.md li { margin: .15em 0; }
.md li > ul { margin: .15em 0; list-style: circle; }
.md li > ol { margin: .15em 0; list-style: lower-alpha; }
.md blockquote { margin: 0 0 .5em; border-left: 2px solid var(--color-line); padding-left: .8em; color: var(--color-dim); }
.md a { color: var(--color-accent); text-decoration: underline; text-underline-offset: 2px; }
/* Inline code: plain mono, no pill/bubble — muted blue, distinct from
   links (accent) but calm against the body ink. */
.md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .9em; color: var(--color-code);
}
.md pre {
  background: var(--color-bg); border: 1px solid var(--color-line); border-radius: 6px;
  padding: .6em .75em; margin: 0 0 .5em; overflow-x: auto;
}
.md pre code { background: none; border: 0; padding: 0; font-size: .85em; }
.md table { border-collapse: collapse; margin: 0 0 .5em; display: block; max-width: 100%; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--color-line); padding: .25em .6em; text-align: left; }
.md th { background: var(--color-panel); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--color-line); margin: .8em 0; }
.md img { max-width: 100%; }
.md del { color: var(--color-dim); }
</style>
<script>
  // Apply the saved theme before first paint (app.js re-applies on mount).
  try {
    const t = localStorage.getItem('clown-circus-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body class="bg-bg text-ink font-sans text-sm leading-[1.45]">
  <div id="root"></div>
  <script type="module" src="/vendor/bundle.js"></script>
</body>
</html>
